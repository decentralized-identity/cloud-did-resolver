name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      # pnpm 11.28.12: Socket-checked (no CVE alerts). --pm-on-fail=ignore on every
      # call keeps it from switching to a project's own packageManager version.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.12
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install ThisDID dependencies
        run: npm ci
      - name: Install TypeScript DID Resolver dependencies
        working-directory: vendor/did-resolver
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile
      - name: Install forked driver cores (vendor/forks)
        run: npm run install:forks
      - name: Install ThisDID vendored driver dependencies
        run: |
          for d in $(npm run -s vendor:list); do
            (cd vendor/$d && pnpm --pm-on-fail=ignore install --frozen-lockfile) || exit 1
          done
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify TypeScript DID Resolver
        working-directory: vendor/did-resolver
        run: pnpm --pm-on-fail=ignore run lint && pnpm --pm-on-fail=ignore run format:check && pnpm --pm-on-fail=ignore run test && pnpm --pm-on-fail=ignore run build
      - name: Build forked driver cores (the wrappers compile against them)
        run: npm run build:forks
      - name: Verify forked driver cores (upstream suites under vitest)
        run: npm run test:forks
      - name: Verify ThisDID vendored driver packages
        run: |
          for d in $(npm run -s vendor:list); do
            (cd vendor/$d && pnpm --pm-on-fail=ignore run format:check && pnpm --pm-on-fail=ignore test && pnpm --pm-on-fail=ignore run build) || exit 1
          done
      - name: Verify ThisDID
        run: npm run check
